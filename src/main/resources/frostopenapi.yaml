openapi: 3.0.3
info:
  title: Frost kvkafka Observations API
  version: 1.0.0
  description: OpenAPI for obs/met.no/kvkafka/get on frost-beta.met.no
servers:
  - url: https://frost-beta.met.no
paths:
  /api/v1/obs/met.no/kvkafka/get:
    get:
      summary: Get observations
      description: Returns time series observations for one or more stations.
      security:
        - basicAuth: []
      parameters:
        - name: stationids
          in: query
          required: true
          description: Comma-separated station IDs (e.g., 58070)
          schema:
            type: string
            example: "58070"
        - name: elementids
          in: query
          required: false
          description: Comma-separated element IDs (e.g., TAM,RR_1)
          schema:
            type: string
            example: "TAM,RR_1"
        - name: time
          in: query
          required: true
          description: ISO 8601 time interval (start/end)
          schema:
            type: string
            example: "2025-09-27T00:00:00Z/2025-09-27T05:00:00Z"
        - name: incobs
          in: query
          required: false
          description: Include observations in response
          schema:
            type: boolean
            default: false
            example: true
        - name: timeresolutions
          in: query
          required: true
          description: Temporal resolution
          schema:
            type: string
            enum: [PT10M, PT1H]
            example: PT10M
        - name: levels
          in: query
          required: false
          schema:
            type: string
            example: "all"
        - name: performancecategories
          in: query
          required: false
          schema:
            type: string
            example: "all"
        - name: sensors
          in: query
          required: false
          schema:
            type: string
            example: "all"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrostResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Server error
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    FrostResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Data'
    Data:
      type: object
      required: [tstype, tseries]
      properties:
        tstype:
          type: string
          example: met.no/kvkafka
        tseries:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesItem'
    TimeSeriesItem:
      type: object
      required: [header, observations]
      properties:
        header:
          $ref: '#/components/schemas/Header'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
    Header:
      type: object
      required: [id, extra]
      properties:
        id:
          $ref: '#/components/schemas/HeaderId'
        extra:
          $ref: '#/components/schemas/HeaderExtra'
        available:
          type: object
          properties:
            from:
              type: string
              format: date-time
              example: "2020-10-30T01:00:00Z"
    HeaderId:
      type: object
      properties:
        level:
          type: integer
          example: 0
        parametercode:
          type: string
          example: RR_1
        parameterid:
          type: integer
          example: 106
        sensor:
          type: integer
          example: 0
        stationid:
          type: integer
          example: 58070
        stationtype:
          type: string
          example: nationalnummer
        typeid:
          type: integer
          example: 501
    HeaderExtra:
      type: object
      properties:
        element:
          $ref: '#/components/schemas/ElementInfo'
        station:
          $ref: '#/components/schemas/StationInfo'
        timeseries:
          $ref: '#/components/schemas/TimeseriesInfo'
    ElementInfo:
      type: object
      properties:
        description:
          type: string
          example: Amount of precipitation per hour
        id:
          type: string
          example: sum(precipitation_amount PT1H)
        name:
          type: string
          example: Precipitation (1 h)
        unit:
          type: string
          example: mm
    StationInfo:
      type: object
      properties:
        shortname:
          type: string
          example: Sandane
        location:
          type: array
          items:
            $ref: '#/components/schemas/StationLocation'
    StationLocation:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        value:
          $ref: '#/components/schemas/StationLocationValue'
    StationLocationValue:
      type: object
      properties:
        "elevation(masl/hs)":
          type: string
          example: "51"
        latitude:
          type: string
          example: "61.788000"
        longitude:
          type: string
          example: "6.183700"
    TimeseriesInfo:
      type: object
      properties:
        geometry:
          $ref: '#/components/schemas/TimeseriesGeometry'
        quality:
          $ref: '#/components/schemas/QualityInfo'
        timeoffset:
          type: string
          example: PT0H
        timeresolution:
          type: string
          example: PT1H
    TimeseriesGeometry:
      type: object
      properties:
        level:
          type: object
          properties:
            unit:
              type: string
              example: m
            value:
              type: string
              example: "10"
    QualityInfo:
      type: object
      properties:
        exposure:
          type: array
          items:
            $ref: '#/components/schemas/QualityItem'
        performance:
          type: array
          items:
            $ref: '#/components/schemas/QualityItem'
    QualityItem:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        value:
          type: string
          example: unknown
    Observation:
      type: object
      required: [time, body]
      properties:
        time:
          type: string
          format: date-time
          example: "2025-09-27T00:00:00Z"
        body:
          type: object
          properties:
            qualitycode:
              type: string
              example: "0"
            value:
              type: string
              description: Numeric content returned as string
              example: "0"

