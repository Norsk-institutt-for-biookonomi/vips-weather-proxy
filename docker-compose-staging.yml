services:
  vipsweatherproxy:
    image: ${TAG_NAME}
    user: "1006:1010"
    environment:
      QUARKUS_ROOT_PATH: ${QUARKUS_ROOT_PATH}
      QUARKUS_PROFILE: staging
      FIELDCLIMATE_API_USERNAME: ${FIELDCLIMATE_API_USERNAME}
      FIELDCLIMATE_API_PASSWORD: ${FIELDCLIMATE_API_PASSWORD}
      FIELDCLIMATE_API_CLIENT_ID: ${FIELDCLIMATE_API_CLIENT_ID}
      FIELDCLIMATE_API_CLIENT_SECRET: ${FIELDCLIMATE_API_CLIENT_SECRET}
      TAHMOOPEN_CREDENTIALS: ${TAHMOOPEN_CREDENTIALS}
      VITIMETEO_API_USERNAME: ${VITIMETEO_API_USERNAME}
      VITIMETEO_API_PASSWORD: ${VITIMETEO_API_PASSWORD}
      FROST_CLIENT_ID: ${FROST_CLIENT_ID}
      FROST_CLIENT_SECRET: ${FROST_CLIENT_SECRET}
      QUARKUS_SMALLRYE_OPENAPI_INFO_DESCRIPTION: ${QUARKUS_SMALLRYE_OPENAPI_INFO_DESCRIPTION}
    ports:
      - "8082:8080"
    volumes:
      - /var/log:/log
    restart: always
